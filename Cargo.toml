[package]
name = "xndo-rs"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["xndo-rs contributors"]
description = "Rust/Python legacy semiempirical quantum chemistry library for MNDO-family, MINDO, ZINDO/INDO and related NDO models."
readme = "README.md"
homepage = "https://pypi.org/project/xndo-rs-python/"
include = [
    "/src/**",
    "/tests/**/*.rs",
  "/tests/data/*.tsv",
  "/tests/data/*.md",
  "/tests/data/*.sha256",
    "/tests/*.py",
    # The photoexcitation study. `tests/photoexcitation.rs` compares its own
    # output against the committed `results.tsv`, so an sdist without it ships a
    # test that cannot run; this is a whitelist, so leaving it out fails
    # silently rather than loudly.
    "/studies/**/*.tsv",
    "/studies/**/*.md",
    "/examples/*.xyz",
    "/tools/**/*.py",
    "/tools/**/*.xyz",
    "/python/**/*.py",
    "/docs/*.md",
    "/third_party/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/THIRD_PARTY_LICENSES_RUST.md",
    "/NOTICE",
    "/LICENSES/*.txt",
    "/VALIDATION_STATUS.md",
]
autobins = false

[lib]
name = "xndo_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "xndo_rs_cli"
path = "src/bin/xndo_rs.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Symbol names carry the build machine's paths into the shipped binary. Stripping
# them is the half of that problem a manifest can fix; the other half needs
# --remap-path-prefix at build time, which is why the release recipe in
# README.md sets three of them. Not `panic = "abort"`: that changes semantics.
strip = "symbols"

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
rayon = "1.10"
pyo3 = { version = "0.23.5", optional = true, features = ["extension-module", "abi3-py39"] }

[features]
default = []
python = ["pyo3"]
